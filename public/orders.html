<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My orders — ZedSitolo</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand-link">
          <img src="/images/ZedSitolo.png" alt="ZedSitolo" class="logo-img" />
          <span class="logo">Zed<span>Sitolo</span></span>
        </a>
        <nav class="nav-main" aria-label="Main">
          <div data-role-nav></div>
          <a href="/cart.html" class="cart-link">
            Cart
            <span class="cart-badge" data-cart-count hidden>0</span>
          </a>
          <div data-auth-nav></div>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="page-title">
        <h1>My orders</h1>
        <label class="filter-inline">
          Filter
          <select id="status-filter">
            <option value="all">All statuses</option>
            <option value="Pending">Pending</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </label>
      </div>
      <div id="orders-alert"></div>
      <div id="orders-list"><p class="loading-state">Loading orders…</p></div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> ZedSitolo</p>
      </div>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="/js/utils.js"></script>
    <script src="/js/orders.js"></script>
  </body>
</html>
