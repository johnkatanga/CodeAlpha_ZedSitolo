<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller dashboard — ZedSitolo</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand-link">
          <img src="/images/ZedSitolo.png" alt="ZedSitolo" class="logo-img" />
          <span class="logo">Zed<span>Sitolo</span></span>
        </a>
        <nav class="nav-main" aria-label="Main">
          <div data-role-nav></div>
          <a href="/cart.html" class="cart-link">
            Cart
            <span class="cart-badge" data-cart-count hidden>0</span>
          </a>
          <div data-auth-nav></div>
        </nav>
      </div>
    </header>

    <main class="container dashboard-page">
      <div class="page-title"><h1>Seller dashboard</h1></div>
      <div id="seller-alert"></div>

      <section class="card">
        <h2>Business profile</h2>
        <form id="seller-profile-form" class="form-grid">
          <div class="form-field">
            <label for="profile-phone">Phone contact</label>
            <input type="tel" id="profile-phone" name="phone" required />
          </div>
          <div class="form-field">
            <label for="profile-location">Business location</label>
            <input type="text" id="profile-location" name="location" required />
          </div>
          <button type="submit" class="btn btn-primary">Save profile</button>
        </form>
      </section>

      <section class="card">
        <h2>Incoming orders</h2>
        <div id="seller-orders"><p class="loading-state">Loading…</p></div>
      </section>

      <section class="card">
        <h2>Your inventory</h2>
        <div class="stock-adjust" style="margin-bottom:1rem;">
          <span>All products:</span>
          <button type="button" class="btn btn-ghost btn-sm" data-bulk="-1">−1 each</button>
          <button type="button" class="btn btn-ghost btn-sm" data-bulk="1">+1 each</button>
          <button type="button" class="btn btn-ghost btn-sm" data-bulk="10">+10 each</button>
          <input type="number" id="bulk-set-value" min="0" placeholder="Set all to…" style="width:120px;" />
          <button type="button" class="btn btn-primary btn-sm" id="bulk-set-btn">Set all</button>
        </div>
        <div id="seller-products"><p class="loading-state">Loading…</p></div>
      </section>

      <section class="card">
        <h2 id="product-form-title">Add new product</h2>
        <form id="product-form" class="form-stack">
          <div class="form-field">
            <label for="name">Product title</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-field">
            <label for="description">Detailed description</label>
            <textarea id="description" name="description" required rows="4"></textarea>
          </div>
          <div class="form-grid">
            <div class="form-field">
              <label for="price">Price (ZMW)</label>
              <input type="number" id="price" name="price" min="0" step="0.01" required />
            </div>
            <div class="form-field">
              <label for="stock">Stock quantity</label>
              <input type="number" id="stock" name="stock" min="0" required value="10" />
            </div>
            <div class="form-field">
              <label for="category">Category</label>
              <select id="category" name="category" required>
                <option value="">Select a category…</option>
                <option value="Electronics &amp; Mobile Accessories">Electronics &amp; Mobile Accessories</option>
                <option value="Fashion &amp; Beauty">Fashion &amp; Beauty</option>
                <option value="Home &amp; Kitchen">Home &amp; Kitchen</option>
                <option value="Arts, Crafts &amp; Culture">Arts, Crafts &amp; Culture</option>
                <option value="Local Foods &amp; Groceries">Local Foods &amp; Groceries</option>
                <option value="Sports">Sports</option>
                <option value="Gifts &amp; Celebration">Gifts &amp; Celebration</option>
              </select>
            </div>
          </div>
          <div class="form-field">
            <label for="location">Product location (defaults to your profile)</label>
            <input type="text" id="location" name="location" />
          </div>
          <div class="form-field">
            <label for="image_url">Image URL or uploaded path (optional — a placeholder is used if empty)</label>
            <input type="text" id="image_url" name="image_url" placeholder="https://… or /uploads/…" />
          </div>
          <div class="form-field">
            <label for="video_url">Video URL / embed link or uploaded path</label>
            <input type="text" id="video_url" name="video_url" placeholder="YouTube embed or /uploads/video.mp4" />
          </div>
          <div class="form-field">
            <label for="media-upload">Upload image or video file (fills the field above automatically)</label>
            <input type="file" id="media-upload" accept="image/*,video/*" />
          </div>
          <div class="stock-adjust">
            <button type="submit" class="btn btn-primary" id="product-submit-btn">Create product</button>
            <button type="button" class="btn btn-ghost" id="cancel-edit-btn" hidden>Cancel edit</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> ZedSitolo</p>
      </div>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="/js/utils.js"></script>
    <script src="/js/seller-dashboard.js"></script>
  </body>
</html>
