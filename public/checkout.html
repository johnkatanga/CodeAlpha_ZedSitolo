<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — ZedSitolo</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand-link">
          <img src="/images/ZedSitolo.png" alt="ZedSitolo" class="logo-img" />
          <span class="logo">Zed<span>Sitolo</span></span>
        </a>
        <nav class="nav-main" aria-label="Main">
          <div data-role-nav></div>
          <a href="/cart.html" class="cart-link">
            Cart
            <span class="cart-badge" data-cart-count hidden>0</span>
          </a>
          <div data-auth-nav></div>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="page-title">
        <h1>Checkout</h1>
      </div>
      <div id="checkout-alert"></div>

      <div class="checkout-layout">
        <form id="checkout-form" class="card">
          <h2>Delivery details</h2>
          <div class="form-field">
            <label for="shippingAddress">Shipping address</label>
            <textarea id="shippingAddress" name="shippingAddress" required placeholder="Street, area, city, province"></textarea>
          </div>
          <div class="form-field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" required placeholder="+260 …" />
          </div>
          <button type="submit" class="btn btn-primary" id="place-order-btn">Place order</button>
        </form>

        <aside class="card" id="checkout-summary" aria-live="polite">
          <h2>Order summary</h2>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> ZedSitolo</p>
      </div>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="/js/utils.js"></script>
    <script src="/js/checkout.js"></script>
  </body>
</html>
